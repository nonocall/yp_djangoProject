{% extends "base.html" %}
{% load static %}
{% block title %}限制科室(条件){% endblock %}


{% block extra_css %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/my.css' %}">
{% endblock %}

{% block content %}
    <form id="diagnosisForm">
        {% csrf_token %}
        <label for="rule_category">规则类别 :</label>
        <select id="rule_category" name="rule_category">
            <option value="mz">门诊</option>
            <option value="zy">住院</option>
        </select>
        <label for="rule_category">是非条件 :</label>
        <select id="yes_or_no" name="yes_or_no">
            <option value="yes">是</option>
            <option value="no">不是</option>
        </select>
        <label for="room">输入科室:</label>
        <input type="text" id="room" name="room">
        <button type="submit">生成</button>
    </form>

    <!-- Modal -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <button class="copy-button" onclick="copyToClipboard()">复制</button>
            <p id="resultText"></p>
        </div>
    </div>
{% endblock %}

{% block extra_js %}
    <script>
        document.getElementById('diagnosisForm').addEventListener('submit', function(event) {
            event.preventDefault(); // 阻止表单默认提交行为

            const formData = new FormData(this);
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/myapp/limit_room/', true);
            xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
            xhr.onload = function() {
                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);
                    if (response.reversed_string) {
                        document.getElementById('resultText').innerText = response.reversed_string;
                        document.getElementById('myModal').style.display = 'block';
                    } else {
                        document.getElementById('resultText').innerText = '没有返回结果';
                        document.getElementById('myModal').style.display = 'block';
                    }
                } else {
                    console.error('Error: ', xhr.statusText);
                }
            };
            xhr.send(formData);
        });

        // 关闭模态框
        const modal = document.getElementById('myModal');
        const span = document.getElementsByClassName('close')[0];
        span.onclick = function() {
            modal.style.display = 'none';
        };

        // 复制到剪贴板
        function copyToClipboard() {
            const text = document.getElementById('resultText').innerText;
            navigator.clipboard.writeText(text).then(() => {
                console.log('复制成功！');
                const modal = document.getElementById('myModal');
                modal.style.display = 'none';
            }).catch(err => {
                console.error('复制失败: ', err);
            });
        }
    </script>
{% endblock %}
